[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivoice_comfy"
version = "0.0.3"
description = "A custom nodes for OmniVoice K2-FSA. A fast TTS diffusion audio model with cloning capabilities, and 600 languages"
authors = [
  {name = "Micko Lesmana", email = "mickolesmana@gmail.com"}
]
readme = "README.md"
license = {text = "Apache Software License 2.0"}
requires-python = ">=3.10"
classifiers = []
dependencies = [
    "accelerate",
    "numpy",
    "pydub",
    "soundfile",
    "transformers==5.3.0",
]



[project.optional-dependencies]
dev = [
    "bump-my-version",
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "ruff",  # linting
]

[project.urls]
Repository = "https://github.com/komikndr/omnivoice_comfy"
BugTracker = "https://github.com/komikndr/omnivoice_comfy/issues"
Documentation = "https://github.com/komikndr/omnivoice_comfy/wiki"


[tool.comfy]
PublisherId = "komikndr"
DisplayName = "OmniVoice-Comfy"
Icon = ""
Tags = []
Repository = "https://github.com/komikndr/omnivoice_comfy"

includes = []

[tool.setuptools.package-data]
"*" = ["*.*", "assets/**/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py39"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
